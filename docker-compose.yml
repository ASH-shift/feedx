version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_4LW_COMMANDS_SAFELIST: "ruok,srvr,stat"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo srvr | nc localhost 2181 | grep -q Mode"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - feed-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 168
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - feed-net

  redis:
    image: redis:7.2-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - feed-net

  postgres-user:
    image: postgres:16-alpine
    container_name: postgres-user
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d userdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-user-data:/var/lib/postgresql/data
    networks:
      - feed-net

  postgres-post:
    image: postgres:16-alpine
    container_name: postgres-post
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: postdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-post-data:/var/lib/postgresql/data
    networks:
      - feed-net

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: user-service
    ports:
      - "50051:50051"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres-user:5432/userdb
      KAFKA_BROKERS: kafka:29092
      GRPC_PORT: 50051
      JWT_SECRET: super-secret-jwt-key-change-in-production
    depends_on:
      postgres-user:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - feed-net

  post-service:
    build:
      context: .
      dockerfile: services/post-service/Dockerfile
    container_name: post-service
    ports:
      - "50052:50052"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres-post:5432/postdb
      KAFKA_BROKERS: kafka:29092
      GRPC_PORT: 50052
    depends_on:
      postgres-post:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - feed-net

  feed-service:
    build:
      context: .
      dockerfile: services/feed-service/Dockerfile
    container_name: feed-service
    ports:
      - "50053:50053"
    environment:
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      USER_SERVICE_URL: user-service:50051
      GRPC_PORT: 50053
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - feed-net

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: notification-service
    ports:
      - "3001:3001"
    environment:
      KAFKA_BROKERS: kafka:29092
      USER_SERVICE_URL: user-service:50051
      WS_PORT: 3001
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - feed-net

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "3000:3000"
    environment:
      USER_SERVICE_URL: user-service:50051
      POST_SERVICE_URL: post-service:50052
      FEED_SERVICE_URL: feed-service:50053
      JWT_SECRET: super-secret-jwt-key-change-in-production
      PORT: 3000
    depends_on:
      - user-service
      - post-service
      - feed-service
    networks:
      - feed-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: frontend
    ports:
      - "3002:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_WS_URL: ws://localhost:3001
    depends_on:
      - api-gateway
    networks:
      - feed-net

volumes:
  redis-data:
  postgres-user-data:
  postgres-post-data:

networks:
  feed-net:
    driver: bridge
