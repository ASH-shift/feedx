syntax = "proto3";

package post;

service PostService {
  rpc CreatePost(CreatePostRequest) returns (CreatePostResponse);
  rpc GetPost(GetPostRequest) returns (GetPostResponse);
  rpc GetUserPosts(GetUserPostsRequest) returns (GetUserPostsResponse);
  rpc DeletePost(DeletePostRequest) returns (DeletePostResponse);
}

message CreatePostRequest {
  string user_id = 1;
  string username = 2;
  string content = 3;
}

message CreatePostResponse {
  string id = 1;
  string user_id = 2;
  string username = 3;
  string content = 4;
  int64 created_at = 5;
}

message GetPostRequest {
  string post_id = 1;
}

message GetPostResponse {
  string id = 1;
  string user_id = 2;
  string username = 3;
  string content = 4;
  int64 created_at = 5;
}

message GetUserPostsRequest {
  string user_id = 1;
  int32 page = 2;
  int32 limit = 3;
}

message Post {
  string id = 1;
  string user_id = 2;
  string username = 3;
  string content = 4;
  int64 created_at = 5;
}

message GetUserPostsResponse {
  repeated Post posts = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
}

message DeletePostRequest {
  string post_id = 1;
  string user_id = 2;
}

message DeletePostResponse {
  bool success = 1;
  string message = 2;
}
