---
# Notification Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: feed-system
  labels:
    app: notification-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: distributed-feed/notification-service:latest
          ports:
            - containerPort: 3001
          env:
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: feed-system-config
                  key: KAFKA_BROKERS
            - name: USER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: feed-system-config
                  key: USER_SERVICE_URL
            - name: WS_PORT
              valueFrom:
                configMapKeyRef:
                  name: feed-system-config
                  key: WS_PORT
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
# Notification Service - LoadBalancer Service (WebSocket needs stable external IP)
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: feed-system
spec:
  selector:
    app: notification-service
  ports:
    - port: 3001
      targetPort: 3001
  type: LoadBalancer
  # sessionAffinity ensures WebSocket connections stay on the same pod
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 86400
---
# Notification Service - HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: notification-service-hpa
  namespace: feed-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: notification-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
