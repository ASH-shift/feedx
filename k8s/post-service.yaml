---
# Post Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: post-service
  namespace: feed-system
  labels:
    app: post-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: post-service
  template:
    metadata:
      labels:
        app: post-service
    spec:
      containers:
        - name: post-service
          image: distributed-feed/post-service:latest
          ports:
            - containerPort: 50052
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: feed-system-config
                  key: DATABASE_URL_POST
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: feed-system-config
                  key: KAFKA_BROKERS
            - name: GRPC_PORT
              valueFrom:
                configMapKeyRef:
                  name: feed-system-config
                  key: GRPC_PORT_POST
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - "require('net').createConnection(50052, 'localhost').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - "require('net').createConnection(50052, 'localhost').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
# Post Service - ClusterIP Service
apiVersion: v1
kind: Service
metadata:
  name: post-service
  namespace: feed-system
spec:
  selector:
    app: post-service
  ports:
    - port: 50052
      targetPort: 50052
  type: ClusterIP
---
# Post Service - HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: post-service-hpa
  namespace: feed-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: post-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
